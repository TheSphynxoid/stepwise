name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build -w @sphynx/stepwise

      - name: Test library
        run: npm test -w @sphynx/stepwise

      - name: Lint demo
        run: npm run lint -w @stepwise/demo

      - name: Build demo
        run: npm run build -w @stepwise/demo
