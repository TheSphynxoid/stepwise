name: Feature or API feedback
description: Something you wanted to build and couldn't (or could, but awkwardly)
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to build?
      description: The explainer, tour or lesson - the use case matters more than the proposed API.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What did you have to do instead?
  - type: textarea
    id: idea
    attributes:
      label: Proposed API (optional)
